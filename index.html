<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Lab — Comparative Agent Architecture Laboratory</title>
    <meta name="description" content="Comparative Agent Architecture Laboratory — Empirical benchmarks and autonomous cognitive topologies." />
    <meta property="og:title" content="AI Lab — Comparative Agent Architecture Laboratory" />
    <meta property="og:description" content="Empirical benchmarks and autonomous cognitive topologies." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts Inter variable -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet" />

    <script>
      document.documentElement.classList.add('anim');
      var timer = setTimeout(function() {
        document.documentElement.classList.remove('anim');
      }, 2600);
      window.addEventListener('DOMContentLoaded', function() {
        var lastLogo = document.querySelector('.logo-adobe');
        if (lastLogo) {
          lastLogo.addEventListener('animationend', function() {
            clearTimeout(timer);
            document.documentElement.classList.remove('anim');
          }, { once: true });
        }
      });
    </script>

    <style>
      :root {
        --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-display: Inter, var(--font-text);

        /* Scaling system: Frame 1560 × 1008 */
        --u: min(0.06410256vw, 0.12400794vh);
        --vu: 0.09920635vh;
        --inset-top: 41;
        --inset-bottom: 106;

        /* Nav */
        --brand-x: 225; --brand-y: 45; --mark: 34; --brand-gap: 12; --brand-fs: 18.49;
        --links-y: 50.5; --links-gap: 50; --links-fs: 21.69;
        --cta-x: 1195; --cta-y: 42; --cta-w: 140; --cta-h: 43; --cta-r: 12; --cta-fs: 15.70; --cta-dy: 2;

        /* Hero */
        --hero-gap: 51;
        --h1-y: 323; --h1-fs: 36.25; --display-ls: 0.0018em;
        --nav-ls: -0.0115em; --brand-ls: -0.0154em; --cta-ls: -0.0127em; --body-ls: 0.007em;
        --label-ls: normal; --model-ls: normal; --proof-ls: 0.0065em;

        /* Weights */
        --w-regular: 400; --w-display-wght: 410; --w-medium: 500; --w-semibold: 600;
        --w-display: var(--w-display-wght); --w-nav: 400; --w-brand: 500; --w-cta: 520;
        --w-body: var(--w-regular); --w-label: var(--w-medium);
        --w-model: var(--w-regular); --w-proof: 480;

        /* Composer */
        --card-x: 425; --card-y: 413; --card-w: 708; --card-h: 143; --card-r: 26;
        --ph-x: 452; --ph-y: 446; --ph-fs: 9.97;
        --chips-x: 444; --chips-y: 505; --chip-h: 30; --chip-r: 9; --chip-fs: 9.0; --chip-gap: 5.5;
        --son-fs: 10.4; --son-top: 15.5; --chev-gap: 6.2;
        --chev-x: 1013.5; --chev-y: 522.3;
        --att-x: 1043.2; --att-y: 515.1;
        --send-x: 1084; --send-y: 507; --send-d: 35;

        /* Footer */
        --by-y: 799; --by-fs: 14.01; --logo-y: 867; --logo-gap: 62;

        /* Animation Easings */
        --e-primary: cubic-bezier(.16, 1, .3, 1);
        --e-soft: cubic-bezier(.22, 1, .36, 1);
      }

      @supports (height: 100dvh) {
        :root {
          --u: min(0.06410256vw, 0.12400794dvh);
          --vu: 0.09920635dvh;
        }
      }

      @media (min-width: 1561px) {
        :root {
          --inset-top: 27;
          --inset-bottom: 74;
        }
      }

      /* Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      button, input, textarea {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
      }

      img, svg {
        display: block;
      }

      :focus-visible {
        outline: 2px solid #F8B285;
        outline-offset: 3px;
        border-radius: 4px;
      }

      html, body {
        height: 100%;
        width: 100%;
        background: #0a0d12;
      }

      body:has(.stage) {
        overflow: hidden;
      }

      body:not(:has(.stage)) {
        overflow-y: auto;
      }

      body {
        font-family: var(--font-text);
        color: #ffffff;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      /* Stage & Background */
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0a0d12;
      }

      .stage-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
      }

      /* Hidden menu toggle */
      #menu {
        position: fixed;
        top: -9999px;
        left: -9999px;
        opacity: 0;
        pointer-events: none;
      }

      /* NAV */
      header.nav {
        height: calc(43 * var(--u));
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        flex: none;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--brand-gap) * var(--u));
        text-decoration: none;
        color: #ffffff;
      }

      .mark {
        width: calc(var(--mark) * var(--u));
        height: calc(var(--mark) * var(--u));
        flex-shrink: 0;
      }

      .brand-text {
        font-family: var(--font-display);
        font-size: calc(var(--brand-fs) * var(--u));
        font-weight: var(--w-brand);
        letter-spacing: var(--brand-ls);
        font-variation-settings: "opsz" 32;
        transform: translateY(calc(1 * var(--u)));
        text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30);
      }

      /* CTA BUTTON (UPPER-RIGHT CORNER) */
      .cta {
        width: calc(var(--cta-w) * var(--u));
        height: calc(var(--cta-h) * var(--u));
        min-width: 130px;
        min-height: 40px;
        border-radius: calc(var(--cta-r) * var(--u));
        align-self: flex-start;
        margin-top: calc((42 - 41) * var(--u));
        background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
        box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, .28);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #ffffff;
        font-family: var(--font-text);
        font-size: calc(var(--cta-fs) * var(--u));
        font-weight: var(--w-cta);
        letter-spacing: var(--cta-ls);
        transition: filter .18s ease, transform .1s ease, box-shadow .2s ease;
        cursor: pointer;
        user-select: none;
        outline: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .cta span {
        transform: translateY(calc(var(--cta-dy) * var(--u)));
      }

      .cta:hover {
        filter: brightness(1.20);
        box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .20), 0 calc(4 * var(--u)) calc(18 * var(--u)) rgba(156, 134, 206, 0.35);
      }

      .cta:active {
        transform: translateY(1px);
        filter: brightness(1.05);
      }

      .cta:focus-visible {
        outline: 2px solid #9C86CE;
        outline-offset: 3px;
      }

      @media (max-width: 768px) {
        .cta {
          display: inline-flex !important;
          width: auto;
          min-width: 110px;
          height: 38px;
          min-height: 38px;
          padding: 0 16px;
          font-size: 13.5px;
          border-radius: 10px;
          margin-top: 0;
        }
      }

      /* TRANSITION STATES BETWEEN FASTSHOT AND LABORATORY */
      .landing-content-wrap {
        transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 520ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 520ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform, filter;
      }

      .landing-content-wrap.transition-exiting {
        opacity: 0;
        transform: translateY(-16px);
        filter: blur(6px);
        pointer-events: none;
      }

      .landing-content-wrap.transition-entering {
        animation: landingFadeIn 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes landingFadeIn {
        from {
          opacity: 0;
          transform: translateY(-16px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      .lab-shell-wrap {
        transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 520ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 520ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform, filter;
      }

      .lab-shell-wrap.transition-entering {
        animation: labFadeSlideIn 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .lab-shell-wrap.transition-exiting {
        opacity: 0;
        transform: translateY(16px);
        filter: blur(4px);
        pointer-events: none;
      }

      @keyframes labFadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(16px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .landing-content-wrap,
        .landing-content-wrap.transition-exiting,
        .landing-content-wrap.transition-entering,
        .lab-shell-wrap,
        .lab-shell-wrap.transition-entering,
        .lab-shell-wrap.transition-exiting {
          animation: none !important;
          transition: opacity 160ms ease !important;
          transform: none !important;
          filter: none !important;
        }
      }

      @media (max-width: 1180px) {
        .get-started-btn {
          min-height: 48px;
          padding: 0 32px;
          border-radius: 24px;
          font-size: 16px;
          gap: 10px;
        }
        .get-started-arrow {
          width: 16px;
          height: 16px;
        }
      }

      /* COMPOSER CARD */
      .card {
        width: calc(var(--card-w) * var(--u));
        height: calc(var(--card-h) * var(--u));
        border-radius: calc(var(--card-r) * var(--u));
        margin-right: calc(3 * var(--u));
        background: rgba(41, 41, 43, .955);
        backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
        -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
        box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
        position: relative;
      }

      .ph {
        position: absolute;
        left: calc((452 - 425) * var(--u));
        top: calc((446 - 413) * var(--u));
        right: calc(24 * var(--u));
        color: #8B8C8E;
        font-size: calc(var(--ph-fs) * var(--u));
        font-weight: var(--w-body);
        line-height: 1.35;
        letter-spacing: var(--body-ls);
        white-space: nowrap;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
      }

      /* Toolbar strip */
      .tools {
        position: absolute;
        left: calc((444 - 425) * var(--u));
        top: calc((505 - 413) * var(--u));
        height: calc(var(--chip-h) * var(--u));
        right: calc((425 + 708 - 1134) * var(--u));
      }

      .chips {
        display: flex;
        align-items: center;
        gap: calc(var(--chip-gap) * var(--u));
        height: 100%;
      }

      .chip {
        height: calc(var(--chip-h) * var(--u));
        border-radius: calc(var(--chip-r) * var(--u));
        font-size: calc(var(--chip-fs) * var(--u));
        font-weight: var(--w-label);
        letter-spacing: var(--label-ls);
        color: #909093;
        line-height: 1;
        background: linear-gradient(180deg, rgba(255, 255, 255, .088) 0%, rgba(255, 255, 255, .050) 45%, rgba(255, 255, 255, .038) 100%);
        border: 1px solid rgba(255, 255, 255, .05);
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        text-decoration: none;
        width: calc(var(--cw) * var(--u));
        padding-left: calc(var(--pl) * var(--u));
        gap: calc(var(--ig) * var(--u));
        transition: background .18s ease, color .18s ease;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .chip:hover {
        background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .07));
        color: #c8c8cb;
      }

      .chip span {
        transform: translateY(calc(2 * var(--u)));
        display: inline-block;
      }

      .chip-icon-screens {
        width: calc(15.06 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      .chip-icon-figma {
        width: calc(11.8 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      .chip-icon-theme {
        width: calc(12.13 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      /* RIGHT CLUSTER: Absolute coordinates inside .tools */
      .right {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .model {
        position: absolute;
        pointer-events: auto;
        left: calc((955 - 444 - 0.8) * var(--u));
        top: calc(var(--son-top) * var(--u));
        font-size: calc(var(--son-fs) * var(--u));
        font-weight: var(--w-model);
        letter-spacing: var(--model-ls);
        color: #98999C;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        gap: calc(var(--chev-gap) * var(--u));
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        transition: color .18s ease;
      }

      .model:hover {
        color: #c8c8cb;
      }

      .model svg {
        width: calc(6.8 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      .attach {
        position: absolute;
        pointer-events: auto;
        left: calc((1043.15 - 444) * var(--u));
        top: calc((515.14 - 505) * var(--u));
        color: #A9AAAD;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: color .18s ease;
      }

      .attach:hover {
        color: #ffffff;
      }

      .attach svg {
        width: calc(19.79 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      .send {
        position: absolute;
        pointer-events: auto;
        left: calc((1084 - 444) * var(--u));
        top: calc((507 - 505) * var(--u));
        width: calc(var(--send-d) * var(--u));
        height: calc(var(--send-d) * var(--u));
        border-radius: 50%;
        background: linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
        box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(210, 110, 60, .34);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 0;
        padding: 0;
        transition: filter .18s ease, transform .1s ease;
      }

      .send:hover {
        filter: brightness(1.07);
      }

      .send:active {
        transform: scale(.95);
      }

      .send svg {
        width: calc(11.66 * var(--u));
        height: auto;
        flex-shrink: 0;
      }

      /* FOOTER */
      footer.proof {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(52.3 * var(--vu));
      }

      .by {
        font-family: var(--font-display);
        font-size: calc(var(--by-fs) * var(--u));
        font-weight: var(--w-proof);
        letter-spacing: var(--proof-ls);
        color: rgba(255, 255, 255, .95);
        font-variation-settings: "opsz" 32;
        text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .35);
      }

      .logos {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(var(--logo-gap) * var(--u));
        filter: drop-shadow(0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30));
        color: #ffffff;
      }

      .logo-google {
        width: calc(96.84 * var(--u));
        height: auto;
      }

      .logo-cisco {
        width: calc(67.29 * var(--u));
        height: auto;
      }

      .logo-adobe {
        width: calc(88.68 * var(--u));
        height: auto;
      }

      /* ENTRANCE ANIMATIONS */
      @media (prefers-reduced-motion: no-preference) {
        @keyframes e-settle-down {
          from { opacity: 0; transform: translateY(calc(-5 * var(--u))); }
          to { opacity: 1; transform: none; }
        }
        @keyframes e-settle-up {
          from { opacity: 0; transform: translateY(calc(6 * var(--u))); }
          to { opacity: 1; transform: none; }
        }
        @keyframes e-mark {
          from { transform: scale(.9); }
          to { transform: none; }
        }
        @keyframes e-focus {
          from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); }
          to { opacity: 1; transform: none; filter: blur(0); }
        }
        @keyframes e-panel {
          from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); }
          to { opacity: 1; transform: none; }
        }
        @keyframes e-populate {
          from { opacity: 0; transform: translateY(calc(4 * var(--u))); }
          to { opacity: 1; transform: none; }
        }
        @keyframes e-send {
          from { transform: scale(.82); }
          to { transform: none; }
        }

        html.anim .brand {
          animation: e-settle-down .58s var(--e-soft) .06s both;
        }
        html.anim .brand .mark {
          animation: e-mark .62s var(--e-primary) .06s both;
        }
        html.anim .links .nav-link {
          animation: e-settle-down .50s var(--e-soft) both;
        }
        html.anim .links .nav-link:nth-child(1) { animation-delay: .16s; }
        html.anim .links .nav-link:nth-child(2) { animation-delay: .21s; }
        html.anim .links .nav-link:nth-child(3) { animation-delay: .26s; }
        html.anim .links .nav-link:nth-child(4) { animation-delay: .31s; }

        html.anim .nav .cta {
          animation: e-settle-down .55s var(--e-soft) .34s both;
        }
        html.anim .h1 {
          animation: e-focus 1.00s var(--e-primary) .30s both;
          will-change: transform, opacity;
        }
        html.anim .card {
          animation: e-panel .90s var(--e-primary) .62s both;
          will-change: transform, opacity;
        }
        html.anim .ph {
          animation: e-populate .50s var(--e-soft) .88s both;
        }
        html.anim .chips {
          animation: e-populate .50s var(--e-soft) .94s both;
        }
        html.anim .right {
          animation: e-populate .50s var(--e-soft) 1.00s both;
        }
        html.anim .send {
          animation: e-send .50s var(--e-primary) 1.00s both;
        }
        html.anim .by {
          animation: e-settle-up .55s var(--e-soft) 1.08s both;
        }
        html.anim .logos svg {
          animation: e-settle-up .55s var(--e-soft) both;
        }
        html.anim .logos .logo-google { animation-delay: 1.16s; }
        html.anim .logos .logo-cisco  { animation-delay: 1.22s; }
        html.anim .logos .logo-adobe  { animation-delay: 1.28s; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* 2) TABLET: 600–1180 wide AND height ≥ 600 */
      @media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
        :root {
          --u: 1px;
        }
        .frame {
          padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px);
        }
        .burger, .sheet {
          display: none !important;
        }
        .links {
          display: flex;
        }
        .cta {
          display: inline-flex;
        }
        .h1 {
          font-size: clamp(27px, 4.3vw, 44px);
          line-height: 1.12;
        }
        .card {
          width: min(100%, clamp(516px, 74vw, 760px));
          height: auto;
          margin-right: 0;
          padding: clamp(15px, 1.9vw, 24px);
          border-radius: clamp(17px, 2.1vw, 26px);
          display: flex;
          flex-direction: column;
          gap: clamp(20px, 3.2vh, 44px);
        }
        .ph {
          position: static;
          white-space: normal;
          font-size: clamp(11px, 1.35vw, 14px);
          line-height: 1.4;
        }
        .tools {
          position: static;
          height: auto;
          display: flex;
          flex-direction: row;
          flex-wrap: nowrap;
          align-items: center;
          gap: clamp(10px, 1.4vw, 18px);
        }
        .chips {
          flex-wrap: nowrap;
          gap: clamp(6px, 0.85vw, 10px);
        }
        .chip {
          width: auto;
          height: clamp(29px, 3.4vh, 34px);
          padding: 0 clamp(7px, 1vw, 13px);
          font-size: clamp(9.6px, 1.12vw, 12.5px);
        }
        .right {
          position: static;
          display: flex;
          align-items: center;
          margin-left: auto;
          gap: 0;
          pointer-events: auto;
        }
        .right > * {
          position: static;
          pointer-events: auto;
        }
        .model {
          font-size: clamp(9.8px, 1.12vw, 12.5px);
        }
        .attach {
          margin-left: clamp(9px, 1.4vw, 20px);
        }
        .send {
          margin-left: clamp(9px, 1.3vw, 18px);
          width: clamp(32px, 3.5vw, 38px);
          height: clamp(32px, 3.5vw, 38px);
        }
        footer.proof {
          gap: clamp(15px, 2.5vh, 30px);
        }
      }

      /* 3) COMPACT: max-width 599px, or height < 600px with width <= 1180px */
      @media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
        :root {
          --u: 1px;
        }
        .frame {
          padding:
            max(18px, env(safe-area-inset-top))
            max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right))
            max(20px, env(safe-area-inset-bottom))
            max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left));
        }
        .links {
          display: none !important;
        }
        header.nav .cta {
          display: inline-flex !important;
        }
        .brand .mark {
          width: 30px;
          height: 30px;
        }
        .burger {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 38px;
          height: 38px;
          border-radius: 11px;
          background: rgba(255, 255, 255, .10);
          border: 1px solid rgba(255, 255, 255, .14);
          cursor: pointer;
        }
        .sheet {
          display: grid;
          grid-template-rows: 0fr;
          transition: grid-template-rows 0.32s cubic-bezier(.4, 0, .2, 1);
          width: 100%;
          overflow: hidden;
        }
        #menu:checked ~ .sheet {
          grid-template-rows: 1fr;
        }
        .sheet-inner {
          min-height: 0;
          overflow: hidden;
        }
        .sheet-panel {
          background: rgba(24, 24, 27, .86);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, .09);
          padding: 16px;
          margin-top: 10px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .sheet-link {
          font-size: 15px;
          color: #ffffff;
          text-decoration: none;
          padding: 8px 10px;
          border-radius: 8px;
        }
        .sheet-cta {
          height: 40px;
          border-radius: 11px;
          font-size: 15px;
          font-weight: 520;
          background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 2px 14px rgba(0, 0, 0, .28);
          color: #ffffff;
          text-decoration: none;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-top: 4px;
        }

        .h1 {
          width: 100%;
          max-width: 15ch;
          font-size: clamp(29px, 7.6vw, 50px);
          line-height: 1.14;
          letter-spacing: -.012em;
        }
        .card {
          width: 100%;
          max-width: 600px;
          height: auto;
          margin-right: 0;
          display: flex;
          flex-direction: column;
          gap: clamp(16px, 4.6vh, 34px);
          padding: clamp(13px, 3.4vw, 18px);
          border-radius: 20px;
        }
        .ph {
          position: static;
          white-space: nowrap;
          text-overflow: ellipsis;
          overflow: hidden;
          font-size: clamp(9.4px, 2.95vw, 14px);
        }
        .tools {
          position: static;
          height: auto;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          height: auto;
        }
        .chip {
          width: auto;
          height: 32px;
          padding: 0 10px;
          font-size: 11px;
        }
        .right {
          position: static;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          width: 100%;
          pointer-events: auto;
        }
        .right > * {
          position: static;
          pointer-events: auto;
        }
        .model {
          font-size: 12px;
        }
        .attach {
          margin-left: auto;
        }
        .send {
          margin-left: 14px;
          width: 40px;
          height: 40px;
        }
      }

      /* Extra short viewport override */
      @media (max-width: 1180px) and (max-height: 560px) {
        .frame {
          padding-top: 10px;
        }
        main.hero {
          gap: 16px;
        }
        .h1 {
          font-size: clamp(24px, 5.4vh, 34px);
        }
        footer.proof {
          gap: 10px;
        }
      }
    </style>
